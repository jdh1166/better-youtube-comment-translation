<!DOCTYPE html>
<html lang="en" data-i18n-title="opt.pageTitle">
<head>
  <meta charset="utf-8">
  <title>Better YouTube Comment Translation</title>
  <link rel="stylesheet" href="shared.css">
  <link rel="stylesheet" href="options.css">
</head>
<body>
  <div class="wrap">
    <header class="page-header">
      <img src="../../icons/icon48.png" alt="" width="40" height="40">
      <div>
        <h1>Better YouTube Comment Translation</h1>
        <p class="sub" data-i18n="opt.subtitle"></p>
      </div>
      <!-- 화면 언어는 설치 직후 가장 먼저 눈에 띄어야 하므로 헤더에 둔다 -->
      <div class="header-lang">
        <label for="uiLang" data-i18n="opt.uiLang"></label>
        <select id="uiLang"></select>
      </div>
    </header>

    <div id="welcome" class="notice notice-ok" data-i18n-html="opt.welcome" hidden></div>

    <section class="card">
      <h2 data-i18n="opt.section.general"></h2>

      <label class="switch-row">
        <span class="switch-label"><span data-i18n="opt.enabled"></span>
          <small data-i18n="opt.enabledDesc"></small></span>
        <input type="checkbox" id="enabled" class="switch">
      </label>

      <label class="switch-row">
        <span class="switch-label"><span data-i18n="opt.autoTranslate"></span>
          <small data-i18n="opt.autoTranslateDesc"></small></span>
        <input type="checkbox" id="autoTranslate" class="switch">
      </label>

      <div class="field">
        <label for="targetLang" data-i18n="opt.targetLang"></label>
        <select id="targetLang"></select>
        <p class="hint" data-i18n="opt.targetLangDesc"></p>
      </div>

      <label class="switch-row">
        <span class="switch-label"><span data-i18n="opt.translateReplies"></span>
          <small data-i18n="opt.translateRepliesDesc"></small></span>
        <input type="checkbox" id="translateReplies" class="switch">
      </label>

      <label class="switch-row">
        <span class="switch-label"><span data-i18n="opt.skipSameLanguage"></span>
          <small data-i18n="opt.skipSameLanguageDesc"></small></span>
        <input type="checkbox" id="skipSameLanguage" class="switch">
      </label>
    </section>

    <section class="card">
      <h2 data-i18n="opt.section.engine"></h2>

      <div class="field">
        <label for="engine" data-i18n="opt.engine"></label>
        <select id="engine"></select>
        <p class="hint" id="engine-note"></p>
      </div>

      <div class="field">
        <label for="fallbackEngine">
          <span data-i18n="opt.fallbackEngine"></span>
          <span class="opt" data-i18n="opt.optional"></span>
        </label>
        <select id="fallbackEngine"></select>
        <p class="hint" data-i18n="opt.fallbackDesc"></p>
      </div>

      <!-- Chrome 내장 -->
      <div class="engine-panel" data-engine="builtin">
        <div class="notice" id="builtin-status" data-i18n="opt.builtinChecking"></div>
        <p class="hint" data-i18n="opt.builtinDesc"></p>
        <div class="btn-row">
          <button class="btn" id="warmup-detector" data-i18n="opt.warmupDetector"></button>
          <span class="test-result" id="detector-result"></span>
        </div>
        <p class="hint" data-i18n="opt.warmupDesc"></p>
      </div>

      <!-- DeepL -->
      <div class="engine-panel" data-engine="deepl" hidden>
        <div class="field">
          <label for="deeplKey" data-i18n="opt.deeplKeyLabel"></label>
          <input type="password" id="deeplKey" autocomplete="off" spellcheck="false"
                 placeholder="xxxxxxxx-xxxx-xxxx-xxxx-xxxxxxxxxxxx:fx">
          <p class="hint"><span data-i18n-html="opt.deeplKeyHint"></span>
            <a href="https://www.deepl.com/pro-api" target="_blank" rel="noreferrer noopener"
               data-i18n="opt.deeplKeyLink"></a></p>
        </div>
        <div class="btn-row">
          <button class="btn" data-grant="deepl" data-i18n="opt.grant"></button>
          <button class="btn" data-test="deepl" data-i18n="opt.test"></button>
          <span class="test-result" data-result="deepl"></span>
        </div>
      </div>

      <!-- Google -->
      <div class="engine-panel" data-engine="google" hidden>
        <div class="field">
          <label for="googleKey" data-i18n="opt.googleKeyLabel"></label>
          <input type="password" id="googleKey" autocomplete="off" spellcheck="false" placeholder="AIza…">
          <p class="hint" data-i18n-html="opt.googleKeyHint"></p>
        </div>
        <div class="btn-row">
          <button class="btn" data-grant="google" data-i18n="opt.grant"></button>
          <button class="btn" data-test="google" data-i18n="opt.test"></button>
          <span class="test-result" data-result="google"></span>
        </div>
      </div>

      <!-- LLM -->
      <div class="engine-panel" data-engine="llm" hidden>
        <div class="field">
          <label for="llmEndpoint" data-i18n="opt.llmEndpoint"></label>
          <input type="url" id="llmEndpoint" spellcheck="false"
                 placeholder="https://api.openai.com/v1/chat/completions">
        </div>
        <div class="field">
          <label for="llmModel" data-i18n="opt.llmModel"></label>
          <input type="text" id="llmModel" spellcheck="false" placeholder="gpt-4o-mini">
        </div>
        <div class="field">
          <label for="llmKey" data-i18n="opt.llmKey"></label>
          <input type="password" id="llmKey" autocomplete="off" spellcheck="false">
        </div>
        <p class="hint" data-i18n="opt.llmHint"></p>
        <div class="btn-row">
          <button class="btn" data-grant="llm" data-i18n="opt.grant"></button>
          <button class="btn" data-test="llm" data-i18n="opt.test"></button>
          <span class="test-result" data-result="llm"></span>
        </div>
      </div>
    </section>

    <section class="card">
      <h2 data-i18n="opt.section.display"></h2>

      <label class="switch-row">
        <span class="switch-label"><span data-i18n="opt.showOriginal"></span>
          <small data-i18n="opt.showOriginalDesc"></small></span>
        <input type="checkbox" id="showOriginal" class="switch">
      </label>

      <label class="switch-row">
        <span class="switch-label"><span data-i18n="opt.showEngineBadge"></span>
          <small data-i18n="opt.showEngineBadgeDesc"></small></span>
        <input type="checkbox" id="showEngineBadge" class="switch">
      </label>

      <label class="switch-row">
        <span class="switch-label"><span data-i18n="opt.hideYoutubeButton"></span>
          <small data-i18n="opt.hideYoutubeButtonDesc"></small></span>
        <input type="checkbox" id="hideYoutubeButton" class="switch">
      </label>
    </section>

    <section class="card">
      <h2 data-i18n="opt.section.advanced"></h2>

      <div class="grid2">
        <div class="field">
          <label for="minLength" data-i18n="opt.minLength"></label>
          <input type="number" id="minLength" min="1" max="50">
          <p class="hint" data-i18n="opt.minLengthDesc"></p>
        </div>
        <div class="field">
          <label for="concurrency" data-i18n="opt.concurrency"></label>
          <input type="number" id="concurrency" min="1" max="8">
          <p class="hint" data-i18n="opt.concurrencyDesc"></p>
        </div>
      </div>

      <label class="switch-row">
        <span class="switch-label"><span data-i18n="opt.autoDownloadModels"></span>
          <small data-i18n="opt.autoDownloadModelsDesc"></small></span>
        <input type="checkbox" id="autoDownloadModels" class="switch">
      </label>

      <div class="btn-row">
        <button class="btn btn-danger" id="clear-cache" data-i18n="opt.clearCache"></button>
        <span class="test-result" id="cache-info"></span>
      </div>
    </section>

    <section class="card">
      <h2 data-i18n="opt.section.shortcuts"></h2>
      <p class="hint" data-i18n-html="opt.shortcutsDesc"></p>
    </section>

    <div class="save-bar" id="save-bar" data-i18n="opt.saved"></div>
  </div>

  <script src="../core/constants.js"></script>
  <script src="../core/i18n.js"></script>
  <script src="../core/util.js"></script>
  <script src="../core/settings.js"></script>
  <script src="../core/langdetect.js"></script>
  <script src="../core/engine-builtin.js"></script>
  <script src="options.js"></script>
</body>
</html>
